version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "develop"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"

    open-pull-requests-limit: 10

    groups:
      microsoft-dotnet:
        patterns:
          - "Microsoft.AspNetCore.*"
        update-types:
          - "minor"
          - "patch"

      api-documentation:
        patterns:
          - "Swashbuckle.AspNetCore"
        update-types:
          - "minor"
          - "patch"

      testing:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
        update-types:
          - "minor"
          - "patch"

      code-coverage:
        patterns:
          - "coverlet.*"
        update-types:
          - "minor"
          - "patch"